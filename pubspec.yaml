name: project_xmedit
description: An XML editing tool.
publish_to: 'none'
version: 5.0.2+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  collection: ^1.19.1
  file_picker: ^10.3.3
  path: ^1.9.1
  path_provider: ^2.1.5
  provider: ^6.1.5+1
  shared_preferences: ^2.5.4
  window_manager: ^0.5.1
  xml: ^6.6.1
  url_launcher: ^6.3.2
  uuid: ^4.5.1
  sqflite: ^2.4.2
  sqflite_common_ffi: ^2.3.6
  package_info_plus: ^9.0.0
  desktop_drop: ^0.7.0
  universal_html: ^2.3.0
  sqflite_common_ffi_web: ^1.1.0
  universal_io: ^2.3.1
  logger: ^2.6.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  msix: ^3.16.12
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: false
  ios: false
  image_path: "assets/icon.png"
  min_sdk_android: 21 
  web:
    generate: true
    image_path: "assets/icon.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/code_descriptions.json
    - assets/icd10.json
