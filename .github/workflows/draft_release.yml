name: Draft Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows
    needs: get-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compress Windows Build
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "${{ needs.get-version.outputs.version }}-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: "${{ needs.get-version.outputs.version }}-Windows-x64.zip"

  build-web:
    name: Build Web
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get
        
      - name: Setup Web Binaries
        run: dart run sqflite_common_ffi_web:setup

      - name: Build Web Release
        run: flutter build web --release

      - name: Compress Web Build
        run: zip -r "${{ needs.get-version.outputs.version }}-Web.zip" build/web

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: "${{ needs.get-version.outputs.version }}-Web.zip"

  create-release:
    name: Create Draft Release
    needs: [get-version, build-windows, build-web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-build
          
      - uses: actions/download-artifact@v4
        with:
          name: web-build

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Release ${{ needs.get-version.outputs.version }}
          draft: true
          files: |
            ${{ needs.get-version.outputs.version }}-Windows-x64.zip
            ${{ needs.get-version.outputs.version }}-Web.zip
